name: Bug report
description: Report a reproducible problem with Keyword Monitor.
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Remove API tokens, personal data, and raw results before sharing logs or screenshots. Report security issues privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the app with ...
        2. Create a monitor with ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version or git commit you used.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
  - type: textarea
    id: details
    attributes:
      label: Relevant details
      description: Redacted logs or screenshots, if useful.
